name: Build VRX OTMZ APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unpack ZIP and Fix Manifest
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | sort | tail -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE" -d temp_extract
            if [ $(ls -1 temp_extract | wc -l) -eq 1 ] && [ -d "temp_extract/$(ls -1 temp_extract)" ]; then
              SUBDIR=$(ls -1 temp_extract)
              cp -rf temp_extract/"$SUBDIR"/* .
            else
              cp -rf temp_extract/* .
            fi
            rm -rf temp_extract *.zip
          fi
          find . -name "AndroidManifest.xml" -exec sed -i -E 's/([[:space:]])(name|allowBackup|dataExtractionRules|fullBackupContent|icon|label|roundIcon|supportsRtl|theme|exported|windowSoftInputMode|enabled|foregroundServiceType|value|authorities|multiprocess|permission|ignore)=/\1android:\2=/g' {} +
          find . -name "AndroidManifest.xml" -exec sed -i 's/android:ignore=/tools:ignore=/g' {} +
          find . -name "AndroidManifest.xml" -exec sed -i 's/android:android:/android:/g' {} +

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: VRX-OTMZ-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          
